name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend placeholder for Tauri
        shell: bash
        run: mkdir -p apps/desktop/dist
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Contracts are up to date
        run: cargo run -q -p cosmos-cli -- schema check contracts

  typescript:
    name: TypeScript
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types are up to date
        run: pnpm --filter @cosmos-pkm/schemas check
      - run: pnpm typecheck
      - run: pnpm --filter @cosmos-pkm/desktop build

  binaries:
    name: CLI binaries (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: rust
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cosmos-cli -p cosmosd
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-${{ runner.os }}
          path: |
            target/release/cosmos
            target/release/cosmosd
            target/release/cosmos.exe
            target/release/cosmosd.exe
          if-no-files-found: ignore
          retention-days: 30
