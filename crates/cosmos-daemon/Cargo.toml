[package]
name = "cosmos-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[[bin]]
name = "cosmosd"
path = "src/main.rs"
[dependencies]
cosmos-core = { path = "../cosmos-core" }
cosmos-storage = { path = "../cosmos-storage" }
serde.workspace = true
serde_json.workspace = true
interprocess = "2.4"
fs4 = "0.13"
blake3 = "1"
[dev-dependencies]
tempfile = "3"
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[features]
fault-injection = ["cosmos-storage/fault-injection"]
